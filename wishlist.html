<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Wishlist - Meshflix</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./netflix-theme.css" />
    <style>
      body {
        background-color: #141414;
      }
      .return-btn {
        position: fixed;
        top: 20px;
        left: 130px;
        z-index: 1000;
      }
    </style>
  </head>
  <body class="bg-dark text-white">
    <div class="nf-brand">
      <img src="./images/netflix-logo.png" alt="Meshflix logo" />
    </div>

    <!-- 🔙 Return to Dashboard -->
    <div class="return-btn">
      <a href="dashboard.html" class="btn btn-outline-light btn-sm"
        >🔙 Back to Dashboard</a
      >
    </div>

    <div class="container mt-5">
      <h2 class="mb-4 text-center">My Wishlist</h2>

      <!-- Loading Spinner -->
      <div id="loader" class="text-center my-5">
        <div class="spinner-border text-light" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <!-- Wishlist container -->
      <div
        id="wishlist-container"
        class="row row-cols-1 row-cols-md-3 g-4"
        style="display: none"
      >
        <!-- Wishlist cards will be dynamically inserted here -->
      </div>
    </div>

    <script type="module" src="./wishlist.js"></script>
    <script type="module" src="./firebase.js"></script>
  </body>
</html>
