<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Movies - Meshflix</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="./netflix-theme.css" />
  <style>
    body {
      background-color: #141414;
      color: #fff;
    }

    .return-btn {
      position: fixed;
      top: 20px;
      left: 130px;
      z-index: 1000;
    }

    .card-img-top {
      height: 350px;
      object-fit: cover;
    }

    .card-body {
      padding: 1rem;
    }

    .btn {
      width: 100%;
    }
  </style>
</head>
<body class="bg-dark text-white">

  <div class="nf-brand">
    <img src="./images/netflix-logo.png" alt="Meshflix logo" />
  </div>

  <!-- 🔙 Return to Dashboard -->
  <div class="return-btn">
    <a href="dashboard.html" class="btn btn-outline-light btn-sm">🔙 Back to Dashboard</a>
  </div>

  <div class="container mt-5 pt-4">
    <h2 class="mb-4 text-center">🎬 Available Movies</h2>

    <!-- Loading Spinner -->
    <div id="loader" class="text-center my-5">
      <div class="spinner-border text-light" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Movie container -->
    <div id="movies-container" class="row row-cols-1 row-cols-md-3 g-4" style="display: none;">
      <!-- Movie cards will be dynamically inserted here -->
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="./movie.js"></script>
  <script type="module" src="./firebase.js"></script>

</body>
</html>
