<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meshflix - Home</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./index.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./netflix-theme.css" />
  </head>
  <body>
    <!-- Spinner -->
    <div id="spinner" class="spinner-container">
      <div class="spinner-border text-light" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Brand logo -->
    <div class="nf-brand">
      <img src="./images/netflix-logo.png" alt="Meshflix logo" />
    </div>

    <!-- Hero Section -->
    <div class="overlay"></div>
    <section class="hero-content animate__animated animate__fadeInDown">
      <h1>Welcome to Meshflix movies 🎬</h1>
      <p>
        Stream top movies, create your playlist, and enjoy a personalized
        experience — all in one place!
      </p>
      <div class="btn-group">
        <a href="signup.html" class="btn btn-primary btn-lg">Sign Up</a>
        <a href="login.html" class="btn btn-light btn-lg">Login</a>
      </div>
      <div class="mt-4">
        <a href="./explore.html" class="btn btn-outline-info"
          >Explore as Guest</a
        >
      </div>
    </section>

    <script>
      window.addEventListener("load", () => {
        const spinner = document.getElementById("spinner");
        spinner.style.display = "none";
      });
    </script>
  </body>
</html>
