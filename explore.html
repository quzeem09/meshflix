<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Movies - Meshflix</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./netflix-theme.css" />
    <style>
      body {
        background-color: #141414;
        color: #fff;
      }
      .return-btn {
        position: fixed;
        top: 20px;
        left: 130px;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div class="nf-brand">
      <img src="./images/netflix-logo.png" alt="Meshflix logo" />
    </div>

    <div class="return-btn">
      <a href="./index.html" class="btn btn-outline-light btn-sm"
        >🔙 Back to Landing Page</a
      >
    </div>
    <div class="container py-5">
      <h2 class="text-center mb-4">Explore Popular Movies</h2>
      <div class="row row-cols-1 row-cols-md-3 g-4" id="preview-movies"></div>
      <div class="text-center mt-4">
        <a href="signup.html" class="btn btn-warning">Sign Up to Watch More</a>
      </div>
    </div>

    <script type="module" src="./explore.js"></script>
  </body>
</html>
