<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Meshflix</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./netflix-theme.css" />
    <style>
      body {
        background: #000 url("./images/netflix-bg.png") no-repeat center
          center fixed;
        background-size: cover;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 0;
      }
      .card {
        position: relative;
        z-index: 1;
        background-color: rgba(0, 0, 0, 0.85) !important;
        border-radius: 8px;
      }
    </style>
  </head>
  <body
    class="bg-dark text-white d-flex align-items-center justify-content-center vh-100"
  >
    <div class="card p-4 shadow-lg" style="width: 100%; max-width: 400px">
      <img
        src="./images/netflix-logo.png"
        alt="Meshflix logo"
        class="nf-brand-inline"
      />
      <h3 class="text-center mb-3">Login to Your Account</h3>

      <form id="login-form">
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Enter email"
            required
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div style="position: relative">
            <input
              class="form-control"
              type="password"
              placeholder="Enter Password"
              name="password"
              id="password"
              required
              style="width: 100%; padding-right: 35px"
            />
            <i
              class="fa-solid fa-eye"
              id="togglePassword"
              style="
                position: absolute;
                right: 10px;
                top: 50%;
                transform: translateY(-50%);
                cursor: pointer;
                color: #555;
              "
            ></i>
          </div>
        </div>

        <button
          id="login-btn"
          type="submit"
          class="btn btn-primary w-100 d-flex justify-content-center align-items-center"
        >
          <span id="login-text">Login</span>
          <span
            id="login-spinner"
            class="spinner-border spinner-border-sm ms-2"
            role="status"
            aria-hidden="true"
            style="display: none"
          ></span>
        </button>

        <p class="text-center mt-3">
          Don't have an account?
          <a href="signup.html" class="text-decoration-none">Sign Up</a>
        </p>
        <div class="return-btn">
          <a href="./index.html" class="btn btn-outline-primary btn-sm"
            >🔙 Back to Landing Page</a
          >
        </div>
      </form>
    </div>

    <script type="module" src="./login.js"></script>
  </body>
</html>
