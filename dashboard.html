<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Meshflix</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./dashboard.css" />
    <link rel="stylesheet" href="./netflix-theme.css" />
  </head>
  <body>
    <div class="nf-brand">
      <img src="./images/netflix-logo.png" alt="Meshflix logo" />
    </div>

    <div class="logout-btn">
      <button id="logout-btn" class="btn btn-outline-light">🚪 Logout</button>
    </div>

    <div class="container py-5" style="padding-top: 4.5rem">
      <div class="text-center mb-4">
        <h2>Welcome, <span id="user-name-display">User</span>!</h2>
        <p class="lead">Manage your profile and subscriptions</p>
      </div>

      <!-- Profile Section -->
      <div class="card p-4 mb-4">
        <h4 class="mb-3 text-center">👤 Profile Settings</h4>
        <div
          class="d-flex align-items-center gap-4 flex-wrap justify-content-center"
        >
          <img
            id="profile-display"
            src="./images/default avatar.jpg"
            alt="Profile Image"
            class="rounded-circle"
            width="120"
            height="120"
          />

          <div class="flex-grow-1" style="max-width: 400px">
            <div class="mb-2">
              <input type="file" id="profile-image" class="form-control" />
            </div>
            <div class="mb-2">
              <input
                type="text"
                id="username"
                class="form-control"
                placeholder="Enter Display Name"
              />
            </div>
            <button class="btn btn-primary w-100" id="save-profile-btn">
              <span id="save-profile-text">💾 Save Profile</span>
              <span
                id="save-spinner"
                class="spinner-border spinner-border-sm ms-2"
                role="status"
                aria-hidden="true"
                style="display: none"
              ></span>
            </button>
          </div>
        </div>
      </div>

      <!-- Subscription Section -->
      <div class="card p-4 mb-4 text-center">
        <h4 class="mb-3">📢 Subscription</h4>
        <button class="btn btn-primary w-100" id="subscribe-btn">
          🔔 Subscribe
        </button>
      </div>

      <!-- Navigation Section -->
      <div class="card p-4 text-center">
        <h4 class="mb-3">🎥 Explore</h4>
        <div class="d-grid gap-2">
          <a href="movies.html" class="btn btn-outline-light"
            >🎬 Go to Movies</a
          >
          <a href="wishlist.html" class="btn btn-outline-light"
            >⭐ View Wishlist</a
          >
        </div>
      </div>
    </div>

    <script type="module" src="./dashboard.js"></script>
    <script type="module" src="./firebase.js"></script>
  </body>
</html>
